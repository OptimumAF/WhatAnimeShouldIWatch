name: Publish Data Release Assets (held)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Unset use-specific variables skip this job; a recorded approval still
    # cannot reactivate the legacy ratings and mutable-tag upload path.
    if: ${{ vars.PROVIDER_DATA_PUBLICATION_APPROVED == 'true' && vars.PROVIDER_DATA_PUBLICATION_APPROVAL_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify recorded publication approval
        env:
          PROVIDER_DATA_APPROVAL_REF: ${{ vars.PROVIDER_DATA_PUBLICATION_APPROVAL_REF }}
        run: python3 scripts/verify_provider_data_approval.py publication

      - name: Refuse legacy data release publication
        run: |
          echo "Legacy data-latest publication is disabled by decision 0028." >&2
          echo "M8.3 requires an audited aggregate-only immutable bundle." >&2
          exit 1
