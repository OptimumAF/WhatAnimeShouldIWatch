name: Fixture and fast checks

on:
  pull_request:
    branches: ["master", "codex/**"]

permissions:
  contents: read

jobs:
  verify-windows-private-ports:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 action runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install fixture-only Node dependencies
        run: npm ci --ignore-scripts
      - name: Check private Windows ports with invented temporary data
        run: npm run metadata:windows:fixture:check
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24 action runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install fast Python test dependency
        run: python -m pip install "numpy>=2,<3" "PyYAML>=6,<7" "optuna>=4,<5"
      - name: Install CPU LightGCN experiment dependency
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Generate and verify synthetic artifacts
        run: |
          npm run data:fixture
          npm run data:fixture:check
          npm run desktop:fixture:check
          npm run split:fixture:check
          npm run ml:train:split:fixture
          npm run ml:refit:fixture
          npm run eval:new-user:fixture
          npm run eval:baselines:fixture
          npm run eval:experiments:fixture
          npm run eval:metrics:fixture
          npm run eval:model-parity:fixture
      - name: Typecheck
        run: npm run typecheck
      - name: Pipeline tests
        run: npm test
      - name: Python parsing and ranking tests
        run: npm run test:python
      - name: Provider approval gate tests
        run: python -m unittest discover -s scripts/tests
      - name: Build web
        run: npm run build:web
      - name: Install browser for smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:e2e
