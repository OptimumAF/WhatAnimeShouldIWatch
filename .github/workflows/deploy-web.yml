name: Deploy Web (GitHub Pages)

on:
  push:
    branches: ["master"]
    paths:
      - "web/**"
      - "pipeline/**"
      - ".github/workflows/deploy-web.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # This build downloads the provider-derived release before creating Pages output.
    if: ${{ vars.PROVIDER_DATA_DEPLOYMENT_APPROVED == 'true' && vars.PROVIDER_DATA_DEPLOYMENT_APPROVAL_REF != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify recorded deployment approval
        env:
          PROVIDER_DATA_APPROVAL_REF: ${{ vars.PROVIDER_DATA_DEPLOYMENT_APPROVAL_REF }}
        run: python3 scripts/verify_provider_data_approval.py deployment

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch release data assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run data:fetch:release

      - name: Sync data into web/public
        run: npm run sync:web

      - name: Build web
        run: npm run build:web

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: ${{ vars.PROVIDER_DATA_DEPLOYMENT_APPROVED == 'true' && vars.PROVIDER_DATA_DEPLOYMENT_APPROVAL_REF != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
