name: Check Windows desktop package

on:
  pull_request:
    paths:
      - "desktop/**"
      - "rust-toolchain.toml"
      - ".github/workflows/build-rust-desktop.yml"
  push:
    branches: ["master"]
    paths:
      - "desktop/**"
      - "rust-toolchain.toml"
      - ".github/workflows/build-rust-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - name: Install Python for package checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check

      - name: Lint desktop app
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Test desktop app
        run: cargo test --locked --manifest-path desktop/Cargo.toml

      - name: Build desktop app
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Build and verify local portable package
        run: |
          python desktop/scripts/windows_package.py package
          python desktop/scripts/windows_package.py check --compare-source
          python desktop/scripts/windows_smoke_kit.py build
          python desktop/scripts/windows_smoke_kit.py check
          python -m unittest discover -s desktop/scripts -p "test_*.py"

      - name: Check packaged runtime prerequisites
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'anime-graph-desktop-candidate'
          Expand-Archive -LiteralPath desktop/target/package/anime-graph-desktop-windows-x64.zip -DestinationPath $probe
          & (Join-Path $probe 'anime-graph-desktop/Check-Prerequisites.ps1')

      - name: Smoke packaged GUI without a checkout
        shell: pwsh
        run: |
          $workspaceItem = Get-Item -LiteralPath $env:GITHUB_WORKSPACE -Force
          $runnerTempItem = Get-Item -LiteralPath $env:RUNNER_TEMP -Force
          $workspace = $workspaceItem.FullName.TrimEnd('\')
          $runnerRoot = $runnerTempItem.Parent.FullName.TrimEnd('\')
          $repositoryName = ($env:GITHUB_REPOSITORY -split '/')[1]
          if (-not $workspace.StartsWith($runnerRoot + '\', [StringComparison]::OrdinalIgnoreCase) -or
              (Split-Path -Leaf $workspace) -ne $repositoryName -or
              ($workspaceItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'The checkout is not a regular child of the runner workspace.'
          }
          $kit = Join-Path $env:RUNNER_TEMP 'anime-graph-m9-clean-kit'
          $kitArchive = Join-Path $workspace 'desktop/target/package/anime-graph-desktop-smoke-kit-windows-x64.zip'
          $smokeScript = Join-Path $env:RUNNER_TEMP 'windows_gui_smoke.ps1'
          Copy-Item -LiteralPath (Join-Path $workspace 'desktop/scripts/windows_gui_smoke.ps1') -Destination $smokeScript
          Write-Output "Invented smoke kit SHA-256: $((Get-FileHash -LiteralPath $kitArchive -Algorithm SHA256).Hash.ToLowerInvariant())"
          Expand-Archive -LiteralPath $kitArchive -DestinationPath $kit
          Set-Location -LiteralPath $kit
          foreach ($entry in (Get-ChildItem -LiteralPath $workspace -Force)) {
            $target = [IO.Path]::GetFullPath($entry.FullName)
            if (-not $target.StartsWith($workspace + '\', [StringComparison]::OrdinalIgnoreCase) -or
                ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw 'A checkout entry is outside the verified workspace or is a reparse point.'
            }
            Remove-Item -LiteralPath $target -Recurse -Force
          }
          if (Get-ChildItem -LiteralPath $workspace -Force | Select-Object -First 1) {
            throw 'The checkout was not emptied before the GUI smoke.'
          }
          & $smokeScript -KitDirectory $kit -RequireNoCheckout -ForceKeyboardPicker
