name: Check Windows desktop package

on:
  pull_request:
    paths:
      - "desktop/**"
      - "rust-toolchain.toml"
      - ".github/workflows/build-rust-desktop.yml"
  push:
    branches: ["master"]
    paths:
      - "desktop/**"
      - "rust-toolchain.toml"
      - ".github/workflows/build-rust-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - name: Install Python for package checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Check formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check

      - name: Lint desktop app
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Test desktop app
        run: cargo test --locked --manifest-path desktop/Cargo.toml

      - name: Build desktop app
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Build and verify local portable package
        run: |
          python desktop/scripts/windows_package.py package
          python desktop/scripts/windows_package.py check --compare-source
          python desktop/scripts/windows_smoke_kit.py build
          python desktop/scripts/windows_smoke_kit.py check
          python -m unittest discover -s desktop/scripts -p "test_*.py"

      - name: Check packaged runtime prerequisites
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'anime-graph-desktop-candidate'
          Expand-Archive -LiteralPath desktop/target/package/anime-graph-desktop-windows-x64.zip -DestinationPath $probe
          & (Join-Path $probe 'anime-graph-desktop/Check-Prerequisites.ps1')

      - name: Probe desktop GUI availability
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'anime-graph-desktop-candidate/anime-graph-desktop/anime_graph_desktop.exe'
          $currentSession = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Write-Output "Runner session: $currentSession; interactive: $([Environment]::UserInteractive)"
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path -Parent $exe) -WindowStyle Normal -PassThru
          try {
            $hasWindow = $false
            for ($attempt = 0; $attempt -lt 10; $attempt++) {
              Start-Sleep -Seconds 2
              $app.Refresh()
              if ($app.HasExited) { break }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { $hasWindow = $true; break }
            }
            Write-Output "App session: $($app.SessionId); visible main window: $hasWindow; exited: $($app.HasExited)"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
